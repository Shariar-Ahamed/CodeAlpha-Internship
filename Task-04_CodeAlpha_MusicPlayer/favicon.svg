<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="bgGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#4F46E5"/>
      <stop offset="100%" stop-color="#2563EB"/>
    </linearGradient>
    <linearGradient id="discGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1E293B"/>
      <stop offset="100%" stop-color="#0F172A"/>
    </linearGradient>
    <linearGradient id="accentGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8"/>
      <stop offset="100%" stop-color="#818CF8"/>
    </linearGradient>
  </defs>

  <!-- App Rounded Base -->
  <rect width="64" height="64" rx="16" fill="url(#bgGrad)"/>
  
  <!-- Vinyl Disc Outer Body -->
  <circle cx="32" cy="32" r="23" fill="url(#discGrad)" stroke="rgba(255, 255, 255, 0.15)" stroke-width="1.5"/>
  
  <!-- Vinyl Grooves -->
  <circle cx="32" cy="32" r="18" fill="none" stroke="rgba(255, 255, 255, 0.1)" stroke-width="1" stroke-dasharray="2, 2"/>
  <circle cx="32" cy="32" r="14" fill="none" stroke="rgba(255, 255, 255, 0.08)" stroke-width="1"/>

  <!-- Center Label -->
  <circle cx="32" cy="32" r="10" fill="url(#bgGrad)" stroke="#FFFFFF" stroke-width="1.5"/>
  
  <!-- Music Note / Sound Motif -->
  <path d="M30 26v9.2a2.8 2.8 0 1 1-2-2.7V28h6v4.2a2.8 2.8 0 1 1-2-2.7V26h-2z" fill="#FFFFFF"/>
  
  <!-- Spindle Dot -->
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
</svg>
